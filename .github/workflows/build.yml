
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  builds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "No se encontró ningún ZIP"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Find Android project
        run: |
          APP_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -path "*/app/*" -print -quit)

          if [ -z "$APP_FILE" ]; then
            echo "No se encontró un proyecto Android dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado: $PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubos-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
