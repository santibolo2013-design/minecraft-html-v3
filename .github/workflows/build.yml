
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          unzip -q "$ZIP_FILE" -d .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Prepare project
        run: |
          APP_FILE=$(find . -type f \( -path "*/app/build.gradle" -o -path "*/app/build.gradle.kts" \) -print -quit)
          PROJECT_DIR=$(dirname "$(dirname "$APP_FILE")")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          mkdir -p "$PROJECT_DIR/app/src/main/assets"
          curl -L https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o "$PROJECT_DIR/app/src/main/assets/three.min.js"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cubos-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
